<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peekachu</title>
  <link rel="stylesheet" href="views://mainview/style.css">
  <script src="views://mainview/index.js" defer></script>
</head>
<body>
  <header>
    <h1>👀 Peekachu</h1>
    <div class="project-selector">
      <label for="project-select">Project:</label>
      <select id="project-select">
        <option value="default">default</option>
      </select>
      <button id="add-project-btn" class="btn-add-project" title="Create project">+</button>
      <div id="add-project-form" class="add-project-form" hidden>
        <input type="text" id="new-project-name" placeholder="project-name" autocomplete="off" />
        <button id="create-project-btn" class="btn-create-project">Create</button>
      </div>
    </div>
  </header>

  <main>
    <section class="add-secret">
      <h2>Add Secret</h2>
      <form id="add-form">
        <input type="text" id="secret-name" placeholder="SECRET_NAME" required autocomplete="off" />
        <input type="password" id="secret-value" placeholder="Value" required autocomplete="off" />
        <input type="text" id="secret-comment" placeholder="Comment (optional)" autocomplete="off" />
        <button type="submit">Save</button>
      </form>
      <div id="form-message" class="message" hidden></div>
    </section>

    <section class="secrets-list">
      <h2>Secrets</h2>
      <div id="empty-state" class="empty" hidden>No secrets stored.</div>
      <table id="secrets-table" hidden>
        <thead>
          <tr>
            <th>Name</th>
            <th>Comment</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="secrets-body"></tbody>
      </table>
    </section>
  </main>

  <footer id="status-bar">
    <span id="status-platform"></span>
    <span id="status-provider"></span>
    <span id="status-node"></span>
  </footer>
</body>
</html>
